<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D Print Price Calculator</title>
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--text:#14171c;--muted:#5d6672;--line:#e1e4e9;
  --accent:#ff6a1a;--accent-text:#fff;--soft:#fff1e8;--warn:#fff7d6;--warn-text:#5a4500;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0f1115;--card:#181b21;--text:#eef0f3;--muted:#98a1ad;--line:#2a2f38;--soft:#2a1d14;--warn:#2e2710;--warn-text:#f1d98a;}
}
:root[data-theme="dark"]{--bg:#0f1115;--card:#181b21;--text:#eef0f3;--muted:#98a1ad;--line:#2a2f38;--soft:#2a1d14;--warn:#2e2710;--warn-text:#f1d98a;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;min-height:100vh}
main{max-width:520px;margin:0 auto;padding:22px 18px 40px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0}
.lang{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.lang button{border:0;border-radius:0;padding:7px 11px;font-size:.82rem;background:var(--card);color:var(--muted)}
.lang button.on{background:var(--accent);color:var(--accent-text)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
label{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
.field{margin-bottom:16px}
.inp{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden}
.inp:focus-within{border-color:var(--accent)}
.inp input{flex:1;min-width:0;border:0;background:transparent;color:var(--text);font-size:1.2rem;padding:12px 14px;outline:none}
.inp span{padding:0 14px;color:var(--muted);font-weight:600}
.hint{font-size:.8rem;color:var(--muted);margin-top:5px;min-height:1.2em}
.result{margin-top:20px;background:var(--soft);border-radius:14px;padding:18px}
.row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;color:var(--muted);font-size:.95rem}
.row b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-top:1px dashed var(--line);margin-top:8px;padding-top:12px}
.total small{font-weight:600;color:var(--muted)}
.total strong{font-size:2rem;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap}
.note{margin-top:14px;background:var(--warn);color:var(--warn-text);border-radius:10px;padding:10px 12px;font-size:.88rem}
.btns{display:flex;gap:10px;margin-top:14px}
button{font:inherit;font-weight:600;border-radius:12px;padding:12px 16px;cursor:pointer;border:1.5px solid var(--line);background:var(--card);color:var(--text)}
button.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);flex:1}
details{margin-top:16px}
summary{cursor:pointer;color:var(--muted);font-size:.9rem}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:12px}
.grid .inp input{font-size:1rem;padding:10px}
.grid label{font-size:.78rem}
.formula{margin-top:18px;font-size:.82rem;color:var(--muted);text-align:center}
.logo{display:flex;justify-content:center;margin-bottom:16px}
.logo img{width:min(100%,340px);height:auto;border-radius:16px;display:block}
h2{font-size:1.1rem;margin:0 0 10px;letter-spacing:-.01em}
.brand{font-weight:700;font-size:.78rem;color:var(--accent);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.card+.card{margin-top:16px}
.guide ol{margin:0;padding-left:20px}
.guide li{margin:6px 0}
.guide img{width:100%;height:auto;border-radius:12px;border:1px solid var(--line);margin-top:12px;display:block}
.guide img[hidden]{display:none}
.guide .tip{margin:10px 0 0;font-size:.85rem;color:var(--muted)}
.free p{margin:0 0 12px;color:var(--muted)}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;font-weight:700;border-radius:12px;padding:13px 16px;text-align:center}
a.wa{margin-top:10px;background:#25d366;color:#fff}
a.ig{margin-top:10px;background:linear-gradient(45deg,#f09433,#dc2743,#bc1888);color:#fff}
a.out{border:1.5px solid var(--accent);color:var(--accent)}
select{width:100%;font:inherit;font-size:1.05rem;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text)}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:600;font-size:.92rem;cursor:pointer}
.chk input{width:20px;height:20px;margin-top:1px;accent-color:var(--accent)}
.dn{font-size:.82rem;color:var(--muted);margin:5px 0 0 30px}
.row[hidden]{display:none}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gal img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;display:block;border:1px solid var(--line)}
.info ul{margin:0;padding-left:20px;color:var(--muted)}
.info li{margin:6px 0}
.faq p{margin:4px 0 0;color:var(--muted)}
</style>
</head>
